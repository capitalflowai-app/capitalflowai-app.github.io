name: Sondy źródeł (jednorazowo)

# Sprawdza z serwera GitHub (USA), które źródła odpowiadają. Wynik: tylko nazwa dostawcy, NAZWA znalezionego sekretu,
# kod HTTP, czas, rozmiar i kształt odpowiedzi — nigdy wartości kluczy, adresy z kluczem ani treść odpowiedzi.
# Uruchamia się tylko po zmianie tego pliku albo narzedzia/sondy.py (lub ręcznie); wynik trafia do jednej adnotacji przebiegu.
on:
  push:
    branches: [main]
    paths: ['narzedzia/sondy.py', '.github/workflows/sondy.yml']
  workflow_dispatch:

permissions: {}

jobs:
  sondy:
    runs-on: ubuntu-24.04   # v274: przypięty obraz (etykieta „latest” → Ubuntu 26 od 19.10.2026) — przejście świadomie, po teście
    timeout-minutes: 8   # v294p: sonda surowców ok. 4 min (paczki Twelve Data co 61 s; DEADLINE w sondy.py 240 s)
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7   # v289a: akcje na Node.js 24 (v4/v5 — Node.js 20, wycofywany); najpierw tu, potem kontrola i strona
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Sondy (tylko statusy)
        env:
          ETHERSCAN_KEY: ${{ secrets.ETHERSCAN || secrets.ETHERSCAN_KEY }}
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
          ETHERSCAN_TOKEN: ${{ secrets.ETHERSCAN_TOKEN }}
          CRYPTOPANIC_KEY: ${{ secrets.CRYPTOPANIC || secrets.CRYPTOPANIC_KEY }}
          CRYPTOPANIC_TOKEN: ${{ secrets.CRYPTOPANIC_TOKEN }}
          CRYPTOPANIC_API_KEY: ${{ secrets.CRYPTOPANIC_API_KEY }}
          CRYPTOPANIC_AUTH_TOKEN: ${{ secrets.CRYPTOPANIC_AUTH_TOKEN }}
          TIINGO_KEY: ${{ secrets.TIINGO || secrets.TIINGO_KEY }}
          TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
          TIINGO_TOKEN: ${{ secrets.TIINGO_TOKEN }}
          POLYGON_KEY: ${{ secrets.POLYGON_KEY }}
          MASSIVE_KEY: ${{ secrets.MASSIVEPOLYGON || secrets.MASSIVE_KEY }}
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
          EODHD_KEY: ${{ secrets.EODHD || secrets.EODHD_KEY }}
          EODHD_API_KEY: ${{ secrets.EODHD_API_KEY }}
          EOD_KEY: ${{ secrets.EOD_KEY }}
          EODHD_TOKEN: ${{ secrets.EODHD_TOKEN }}
          FMP_KEY: ${{ secrets.FINANCIALMODELINGPREP || secrets.FMP_KEY }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          FINANCIALMODELINGPREP_KEY: ${{ secrets.FINANCIALMODELINGPREP_KEY }}
          FINANCIALMODELINGPREP_API_KEY: ${{ secrets.FINANCIALMODELINGPREP_API_KEY }}
          ALPHAVANTAGE_KEY: ${{ secrets.ALPHAVANTAGE || secrets.ALPHAVANTAGE_KEY }}
          ALPHA_VANTAGE_KEY: ${{ secrets.ALPHA_VANTAGE_KEY }}
          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
          COINALYZE_KEY: ${{ secrets.COINALYZE_KEY }}      # v126: bez sekretu COINALYZE (właściciel: pomijać)
          BANXICO_TOKEN: ${{ secrets.BANXICO_TOKEN }}
          EVDS_KEY: ${{ secrets.EVDS_KEY }}
          TWELVEDATA_KEY: ${{ secrets.TWELVEDATA_KEY }}   # v294p: sonda surowców — nazwy sekretów jak w strona.yml
          EIA_KEY: ${{ secrets.EIA_KEY }}
          COINGECKO_KEY: ${{ secrets.COINGECKO_KEY }}
        run: |
          python3 narzedzia/sondy.py > sondy.txt 2>&1 || true
          cat sondy.txt
          # wynik jako adnotacje (czytelne bez logowania); znaki specjalne kodowane jak wymaga GitHub. Adnotacja ma ok. 4 KB: najpierw wiersze
          # summary, potem wiersze trzech źródeł z kluczem (v126: Coinalyze, Banxico, EVDS) i ici. v294p: sonda surowców ma ok. 8 KB wierszy summary —
          # dzielone na kilka adnotacji po ≤ 3900 znaków (pierwsza „sondy”, kolejne „sondy-2”, …; najwyżej 9 — GitHub: 10 adnotacji notice na krok)
          python3 -c "
          L=open('sondy.txt',encoding='utf-8').read().splitlines()
          A=[l for l in L if l.startswith('summary')]
          B=[l for l in L if l.split('|')[0].strip() in ('coinalyze','banxico','evds','ici')]
          P,c=[],''
          for l in A+['--']+B:
              l=l[:3900]
              if c and len(c)+1+len(l)>3900:
                  P.append(c)
                  c=''
              c=c+chr(10)+l if c else l
          P.append(c)
          for i,x in enumerate(P[:9]):
              print('::notice title=sondy'+('-'+str(i+1) if i else '')+'::'+x.replace('%','%25').replace(chr(13),'%0D').replace(chr(10),'%0A'))
          "
