name: Strona i dane

on:
  schedule:
    - cron: '7,17,27,37,47,57 * * * *'   # v168: co 10 minut (cel właściciela 05.10: dane jak najszybsze), poza pełną godziną; GitHub może opóźnić o kilka minut — zegar zapasowy czuwa po każdym przebiegu
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}          # uprawnienia nadawane per zadanie (audyt 24.09, B10)

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  zbuduj:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Testy zbieracza (brak nie jest zerem, zakres dat, pamięć podręczna) — awaria blokuje publikację
        run: PYTHONPATH=narzedzia/bez_sieci PYTHONDONTWRITEBYTECODE=1 python3 -m unittest -v test_zbieraj_dane.py   # v122: sieć zablokowana — próba połączenia w teście = kod 3, publikacja staje
      - name: Test bramki strony dla plików widoków silnika (bez przeglądarki) — awaria blokuje publikację
        run: node --test test_widoki.cjs
      - name: Przywróć pamięć zbieracza (ostatnie pliki danych; przeżywa awarię publikacji strony)
        uses: actions/cache/restore@v4
        with:
          path: pamiec-danych
          key: dane-${{ github.run_id }}
          restore-keys: dane-
      - name: Zbierz dane (klucze tylko z Secrets)
        env:
          SEC_CONTACT: ${{ secrets.SEC_CONTACT }}             # v121: insiderzy — adres e-mail do nagłówka zapytań EDGAR (wymóg urzędu); nigdy w plikach strony
          SOSOVALUE_KEY: ${{ secrets.SOSOVALUE_KEY }}
          COINGECKO_KEY: ${{ secrets.COINGECKO_KEY }}
          FINNHUB_KEY: ${{ secrets.FINNHUB_KEY }}
          TWELVEDATA_KEY: ${{ secrets.TWELVEDATA_KEY }}
          COINMARKETCAP_KEY: ${{ secrets.COINMARKETCAP_KEY }}
          FRED_KEY: ${{ secrets.FRED_KEY }}
          EIA_KEY: ${{ secrets.EIA_KEY }}               # v97: energia (EIA)
          BLS_KEY: ${{ secrets.BLS_KEY }}               # v97: makro USA (BLS)
          BEA_KEY: ${{ secrets.BEA_KEY }}               # v97: bilans płatniczy USA (BEA)
          EODHD_KEY: ${{ secrets.EODHD || secrets.EODHD_KEY }}                       # v106: indeksy świata (nazwa sekretu właściciela: EODHD)
          MASSIVE_KEY: ${{ secrets.MASSIVEPOLYGON || secrets.MASSIVE_KEY }}         # v106: notowania ETF (dawniej Polygon; sekret: MASSIVEPOLYGON)
          TIINGO_KEY: ${{ secrets.TIINGO || secrets.TIINGO_KEY }}                    # v106: notowania ETF (zapas; sekret: TIINGO)
          FMP_KEY: ${{ secrets.FINANCIALMODELINGPREP || secrets.FMP_KEY }}           # v106: FMP (sekret: FINANCIALMODELINGPREP)
          ALPHAVANTAGE_KEY: ${{ secrets.ALPHAVANTAGE || secrets.ALPHAVANTAGE_KEY }}  # (sekret: ALPHAVANTAGE)
          ETHERSCAN_KEY: ${{ secrets.ETHERSCAN || secrets.ETHERSCAN_KEY }}           # wieloryby: transfery ETH natywne (w przygotowaniu)
          CRYPTOPANIC_KEY: ${{ secrets.CRYPTOPANIC || secrets.CRYPTOPANIC_KEY }}     # wiadomości (w przygotowaniu)
          CENSUS_KEY: ${{ secrets.CENSUS_KEY }}                                         # handel zagraniczny USA (w przygotowaniu)
          COINALYZE_KEY: ${{ secrets.COINALYZE_KEY }}                                   # v126: dźwignia ze wszystkich dużych giełd (nagłówek api_key; sekret COINALYZE bez _KEY — pomijany)
          BANXICO_TOKEN: ${{ secrets.BANXICO_TOKEN }}                                   # v126: Meksyk przez oficjalne API SIE (nagłówek Bmx-Token)
          EVDS_KEY: ${{ secrets.EVDS_KEY }}                                             # v126: Turcja — pełna historia z EVDS (bank centralny)
          KALSHI_OFF: ${{ vars.KALSHI_OFF }}                                            # v131: wyłącznik szans Fed (zmienna repozytorium, nie sekret): 1 = bez zapytań
          WYCENA_BG_OFF: ${{ vars.WYCENA_BG_OFF }}                                      # v132: wyłącznik SOPR (zmienna repozytorium, nie sekret): 1 = bez zapytań do drugiego źródła
          RWA_OFF: ${{ vars.RWA_OFF }}                                                  # v133.1: wyłącznik tokenizowanych aktywów (zmienna repozytorium, nie sekret): 1 = bez zapytań i bez pliku
          RWA_CHAIN_OFF: ${{ vars.RWA_CHAIN_OFF }}                                      # v150: wyłącznik samego odczytu własnego z łańcucha (zmienna repozytorium, nie sekret): 1 = bez zapytań do łańcuchów
          RWA_EM_OFF: ${{ vars.RWA_EM_OFF }}                                            # v169: wyłącznik samych danych emitentów (zmienna repozytorium, nie sekret): 1 = bez zapytań do emitentów
          CACHE_DIR: pamiec-danych
          # strona użytkownika (repozytorium <konto>.github.io) ma adres bez ścieżki; inne — z nazwą repozytorium
          SITE_URL: ${{ endsWith(github.event.repository.name, '.github.io') && format('https://{0}', github.event.repository.name) || format('https://{0}.github.io/{1}', github.repository_owner, github.event.repository.name) }}
        run: python3 zbieraj_dane.py
      - name: Zapisz pamięć zbieracza
        if: always()
        run: mkdir -p pamiec-danych && cp data/*.json pamiec-danych/ 2>/dev/null || true
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: pamiec-danych
          key: dane-${{ github.run_id }}
      - name: Złóż stronę
        env:
          # v141: adres żywej strony (jak w kroku „Zbierz dane”) — pliki słowników wersji, która jest teraz na żywo
          SITE_URL: ${{ endsWith(github.event.repository.name, '.github.io') && format('https://{0}', github.event.repository.name) || format('https://{0}.github.io/{1}', github.repository_owner, github.event.repository.name) }}
        run: |
          mkdir -p _site/data _site/data/widoki
          cp index.html _site/
          # v141: lżejsza strona — słowniki 8 języków (poza pl i en) w _site/i18n/<język>.<skrót>.js, porównane w node z pełną stroną przed zapisem;
          # odmowa albo błąd = zostaje pełna strona jak dotąd (cięższa, ale działa) i ostrzeżenie w podsumowaniu przebiegu
          if python3 narzedzia/odchudz_strone.py index.html _site; then
            echo "v141: lżejsza strona złożona"
          else
            cp index.html _site/index.html; rm -rf _site/i18n
            echo "::warning title=lżejsza strona::podział słowników nie przeszedł — opublikowana pełna strona (cięższa, działa jak dotąd)"
          fi
          # v141: w obu gałęziach pliki słowników wersji z żywej strony (najwyżej ok. 30 s) — stara index.html z pamięci podręcznej (do 10 min) nie trafi na 404
          python3 narzedzia/odchudz_strone.py --poprzednie "$SITE_URL" _site || true
          cp -r fonts _site/fonts                      # czcionki z tej samej strony (v34) — bez tego zmienia się wygląd
          cp -r img _site/img                          # v96: flagi i loga (SVG z tej samej strony) — bez nich strona bez ikon
          test -f _site/img/flagi/pl.svg                # brak ikon = przerwij publikację
          cp data/*.json _site/data/ 2>/dev/null || true
          cp data/widoki/*.json _site/data/widoki/ 2>/dev/null || true   # widoki silnika (v35), gdy już będą
          test -f _site/fonts/fonts.css                 # brak czcionek = przerwij publikację
          cp robots.txt google433f7c24524100a9.html _site/   # v111: wyszukiwarki (robots, weryfikacja Google metodą pliku)
          if [ -d archiwum ]; then cp -r archiwum _site/archiwum; fi   # v113: archiwum własne (CSV + indeks.json) — wykresy 30/90/365 dni
          sed "s/LASTMOD/$(date -u +%Y-%m-%d)/g" sitemap.xml > _site/sitemap.xml
          test -f _site/sitemap.xml && test -f _site/robots.txt
          touch _site/.nojekyll
          ls -la _site _site/data
      - name: Straż kluczy — wartość żadnego sekretu nie może być w plikach strony (znalezisko = publikacja przerwana)
        env:
          SEC_CONTACT: ${{ secrets.SEC_CONTACT }}
          SOSOVALUE_KEY: ${{ secrets.SOSOVALUE_KEY }}
          COINGECKO_KEY: ${{ secrets.COINGECKO_KEY }}
          FINNHUB_KEY: ${{ secrets.FINNHUB_KEY }}
          TWELVEDATA_KEY: ${{ secrets.TWELVEDATA_KEY }}
          COINMARKETCAP_KEY: ${{ secrets.COINMARKETCAP_KEY }}
          FRED_KEY: ${{ secrets.FRED_KEY }}
          EIA_KEY: ${{ secrets.EIA_KEY }}
          BLS_KEY: ${{ secrets.BLS_KEY }}
          BEA_KEY: ${{ secrets.BEA_KEY }}
          EODHD_KEY: ${{ secrets.EODHD || secrets.EODHD_KEY }}
          MASSIVE_KEY: ${{ secrets.MASSIVEPOLYGON || secrets.MASSIVE_KEY }}
          TIINGO_KEY: ${{ secrets.TIINGO || secrets.TIINGO_KEY }}
          FMP_KEY: ${{ secrets.FINANCIALMODELINGPREP || secrets.FMP_KEY }}
          ALPHAVANTAGE_KEY: ${{ secrets.ALPHAVANTAGE || secrets.ALPHAVANTAGE_KEY }}
          ETHERSCAN_KEY: ${{ secrets.ETHERSCAN || secrets.ETHERSCAN_KEY }}
          CRYPTOPANIC_KEY: ${{ secrets.CRYPTOPANIC || secrets.CRYPTOPANIC_KEY }}
          CENSUS_KEY: ${{ secrets.CENSUS_KEY }}
          COINALYZE_KEY: ${{ secrets.COINALYZE_KEY }}
          BANXICO_TOKEN: ${{ secrets.BANXICO_TOKEN }}
          EVDS_KEY: ${{ secrets.EVDS_KEY }}
        run: python3 narzedzia/straz_kluczy.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  opublikuj:
    needs: zbuduj
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # v145: zapasowy zegar — gdy harmonogram tego workflow stoi (03.10.2026: brak przebiegów z harmonogramu od 11:05 UTC), budzi workflow
  # „Zegar zapasowy” (zegar.yml), który ok. 20 min po starcie tego przebiegu uruchamia następny; v145.2: budzi go ZAWSZE (czuwanie — gdy
  # harmonogram niedawno działał, zegar czeka 30 min i uruchamia przebieg tylko, gdy harmonogram nie zdążył).
  # Zawsze (także po nieudanej publikacji), krótko; błąd zegara nigdy nie psuje przebiegu (kod 0). Wyłącznik: zmienna repozytorium ZEGAR_OFF=1.
  zegar:
    needs: [zbuduj, opublikuj]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: narzedzia/zegar.py
          sparse-checkout-cone-mode: false
      - name: Zegar zapasowy — obudź, gdy harmonogram stoi (token przebiegu tylko w nagłówku)
        env:
          GH_TOKEN: ${{ github.token }}
          ZEGAR_OFF: ${{ vars.ZEGAR_OFF }}
        run: python3 narzedzia/zegar.py zbudz || echo "zegar nieudany — bez wpływu na stronę"
