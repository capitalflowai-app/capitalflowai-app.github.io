name: Zegar zapasowy (gdy harmonogram stoi)

# v145 (03.10.2026): harmonogram „Strona i dane” potrafi stanąć na godziny (GitHub: „All Systems Operational”). v145.2 (04.10): czuwanie
# po KAŻDYM przebiegu strony — uruchamia „Strona i dane” zdarzeniem workflow_dispatch, gdy od startu ostatniego przebiegu minęło 20 min
# (harmonogram stoi ≥ 45 min) albo 30 min (harmonogram niedawno działał, ale nie zdążył). Budzony na końcu każdego przebiegu strony
# i własnym harmonogramem (gdyby ten działał); nowe czuwanie anuluje poprzednie (concurrency).
# v159 (04.10): na początku każdego czuwania także zadania dzienne — kontrola (06:20 UTC) i archiwum (01:20 UTC) uruchamiane, gdy ich
# harmonogram nie ruszył do 07:30 / 03:00 UTC (04.10 kontrola nie ruszyła wcale). Wyłącznik tylko tej części: ZEGAR_DZIENNE_OFF=1.
# v232 (06.10): przed czuwaniem także odblokowanie — przebieg „Strona i dane” w stanie waiting ≥ 15 min, choć nic nie wymaga zatwierdzenia
# (06.10 od 08:47 UTC trzymał grupę „pages” i blokował każdą publikację), jest anulowany; zatwierdzenia przez osobę nie rusza.
# Token: token przebiegu (actions: write), tylko w nagłówku. Wyłącznik: zmienna repozytorium ZEGAR_OFF=1.
on:
  workflow_dispatch:
  schedule:
    - cron: '13,33,53 * * * *'   # niezależne wyzwalanie (gdy harmonogram strony stoi, a ten działa); przy działającym — kilka sekund i koniec

permissions: {}

concurrency:
  group: zegar
  cancel-in-progress: true

jobs:
  prowadz:
    runs-on: ubuntu-24.04   # v274: przypięty obraz (etykieta „latest” → Ubuntu 26 od 19.10.2026) — przejście świadomie, po teście
    timeout-minutes: 40   # v145.2: czekanie do 31 min + doczekanie do 2 min
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: narzedzia/zegar.py
          sparse-checkout-cone-mode: false
      - name: Zegar — zadania dzienne (kontrola 06:20, archiwum 01:20 UTC), gdy ich harmonogram nie ruszył (v159)
        env:
          GH_TOKEN: ${{ github.token }}
          ZEGAR_OFF: ${{ vars.ZEGAR_OFF }}
          ZEGAR_DZIENNE_OFF: ${{ vars.ZEGAR_DZIENNE_OFF }}
        run: python3 narzedzia/zegar.py dzienne || echo "zegar dzienne nieudany — bez wpływu na czuwanie"
      - name: Zegar — odblokuj zawieszoną publikację (przebieg „waiting” bez wymogu zatwierdzenia, v232)
        env:
          GH_TOKEN: ${{ github.token }}
          ZEGAR_OFF: ${{ vars.ZEGAR_OFF }}
        run: python3 narzedzia/zegar.py odblokuj || echo "zegar odblokuj nieudany — bez wpływu na czuwanie"
      - name: Zegar — uruchom „Strona i dane”, gdy harmonogram stoi (token przebiegu tylko w nagłówku)
        env:
          GH_TOKEN: ${{ github.token }}
          ZEGAR_OFF: ${{ vars.ZEGAR_OFF }}
        run: python3 narzedzia/zegar.py prowadz
